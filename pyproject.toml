[project]
name = "discord-purger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.14.4", "rich>=13.0"]

[project.scripts]
discord-purger = "discord_purger.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-cov>=5.0", "pytest-asyncio>=0.23.0", "aioresponses>=0.7.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_purger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
